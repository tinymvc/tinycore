name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: spark-test
          MYSQL_ROOT_HOST: '%'
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pspark-test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: spark-test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zlib, ctype, gd, curl, fileinfo, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, simplexml
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Syntax check
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
        env:
          SPARK_TEST_MYSQL_PASSWORD: spark-test
          SPARK_TEST_PGSQL_PASSWORD: spark-test
